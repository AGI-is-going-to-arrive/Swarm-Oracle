name: Release Signoff

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: release-signoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      can_run: ${{ steps.check.outputs.can_run }}
      missing_secrets: ${{ steps.check.outputs.missing_secrets }}
    steps:
      - name: Check required LLM secrets
        id: check
        env:
          LLM_RESPONSES_URL: ${{ secrets.LLM_RESPONSES_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
        run: |
          missing=()

          if [ -z "${LLM_RESPONSES_URL}" ]; then
            missing+=("LLM_RESPONSES_URL")
          fi
          if [ -z "${LLM_API_KEY}" ]; then
            missing+=("LLM_API_KEY")
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=" >> "$GITHUB_OUTPUT"
            {
              echo "Release signoff preflight passed."
              echo
              echo "- event: ${GITHUB_EVENT_NAME}"
              echo "- ref: ${GITHUB_REF}"
              if [ -n "${LLM_MODEL_NAME}" ]; then
                echo "- model override: configured"
              else
                echo "- model override: not set, workflow will use runtime default"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            missing_csv="$(IFS=,; echo "${missing[*]}")"
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=${missing_csv}" >> "$GITHUB_OUTPUT"
            {
              echo "Release signoff skipped."
              echo
              echo "- event: ${GITHUB_EVENT_NAME}"
              echo "- ref: ${GITHUB_REF}"
              echo "- missing required repository secrets:"
              for key in "${missing[@]}"; do
                echo "  - ${key}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release-signoff:
    needs: preflight
    if: needs.preflight.outputs.can_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create backend virtualenv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend preview assets
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run full release signoff
        env:
          LLM_RESPONSES_URL: ${{ secrets.LLM_RESPONSES_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          DEBATE_USE_LLM: "true"
          SWARM_REQUIRE_DEBATE_ADJUDICATION_MODE: llm_hybrid
          SWARM_SIGNOFF_LABEL: github-release-signoff
          SWARM_URL: http://127.0.0.1:18928
          SWARM_BACKEND_URL: http://127.0.0.1:18927
          SWARM_BACKEND_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: |
          set -euo pipefail

          cleanup() {
            if [ -n "${BACKEND_PID:-}" ]; then
              kill "${BACKEND_PID}" || true
            fi
            if [ -n "${FRONTEND_PID:-}" ]; then
              kill "${FRONTEND_PID}" || true
            fi
          }
          trap cleanup EXIT

          backend/.venv/bin/python -m uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port 18927 > /tmp/swarm-backend-release-signoff.log 2>&1 &
          BACKEND_PID=$!

          (
            cd frontend
            npm run preview -- --host 127.0.0.1 --port 18928 > /tmp/swarm-frontend-release-signoff.log 2>&1
          ) &
          FRONTEND_PID=$!

          python - <<'PY'
          import time
          import urllib.request

          def wait_for(url: str, timeout_seconds: int = 90) -> None:
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status < 500:
                              return
                  except Exception:
                      time.sleep(1)
              raise SystemExit(f"Timed out waiting for {url}")

          wait_for("http://127.0.0.1:18927/")
          wait_for("http://127.0.0.1:18928/")
          PY

          cd frontend
          npm run release:signoff -- --headless --output-root output/e2e/ci-release-signoff

      - name: Upload release signoff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signoff
          retention-days: 14
          if-no-files-found: warn
          path: |
            frontend/output/e2e/ci-release-signoff
            /tmp/swarm-backend-release-signoff.log
            /tmp/swarm-frontend-release-signoff.log

  release-signoff-skipped:
    needs: preflight
    if: needs.preflight.outputs.can_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why full signoff did not run
        run: |
          echo "Full release signoff was skipped because required repository secrets are missing."
          echo "Missing: ${{ needs.preflight.outputs.missing_secrets }}"
          echo "Configure the missing secrets, then rerun this workflow."
