name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: .venv/bin/pip install -e ".[dev]"

      - name: Validate committed sample snapshots
        working-directory: .
        run: backend/.venv/bin/python scripts/validate_samples.py

      - name: Run backend tests
        run: .venv/bin/python -m pytest -q

      - name: Lint backend
        run: .venv/bin/ruff check app/ tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check asset provenance
        run: npm run assets:provenance:check

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend project references
        run: npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: Check performance budgets
        run: npm run perf:budgets:check

  cross-platform-frontend-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for script smoke
        run: npx playwright install chromium

      - name: Exercise cross-platform release signoff dry run
        run: |
          node scripts/release-signoff.mjs --dry-run --skip-backend-checks --skip-assets-check --headless --output-root output/e2e/cross-platform-release-smoke
          node --input-type=module -e "import { closePlaywrightBrowser } from './scripts/playwrightTeardown.mjs'; const browser = { contexts: () => [], close: async () => { throw new Error('ci teardown smoke'); } }; let rejected = false; try { await closePlaywrightBrowser(browser, 'ci teardown smoke', 1); } catch (error) { rejected = error instanceof AggregateError; } if (!rejected) throw new Error('teardown failure was swallowed');"

      - name: Run frontend script unit smoke
        run: |
          node --test scripts/playwrightTeardown.test.mjs scripts/e2e-frontend-preflight.test.mjs scripts/e2eFixtureNet.test.mjs
