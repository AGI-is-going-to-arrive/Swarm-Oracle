name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  release-signoff-preflight:
    runs-on: ubuntu-latest
    outputs:
      can_run: ${{ steps.check.outputs.can_run }}
      missing_secrets: ${{ steps.check.outputs.missing_secrets }}
    steps:
      - name: Check CI release signoff readiness
        id: check
        env:
          LLM_RESPONSES_URL: ${{ secrets.LLM_RESPONSES_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          missing=()

          if [ -z "${LLM_RESPONSES_URL}" ]; then
            missing+=("LLM_RESPONSES_URL")
          fi
          if [ -z "${LLM_API_KEY}" ]; then
            missing+=("LLM_API_KEY")
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=" >> "$GITHUB_OUTPUT"
            {
              echo "CI release signoff preflight passed."
              echo
              echo "- event: ${GITHUB_EVENT_NAME}"
              echo "- ref: ${GITHUB_REF}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            missing_csv="$(IFS=,; echo "${missing[*]}")"
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=${missing_csv}" >> "$GITHUB_OUTPUT"
            {
              echo "CI release signoff preflight skipped."
              echo
              echo "- event: ${GITHUB_EVENT_NAME}"
              echo "- ref: ${GITHUB_REF}"
              echo "- missing required repository secrets:"
              for key in "${missing[@]}"; do
                echo "  - ${key}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: .venv/bin/pip install -e ".[dev]"

      - name: Run targeted backend checks
        run: |
          .venv/bin/python -m pytest \
            tests/test_campaign_api.py \
            tests/test_campaign_service.py \
            tests/test_debate_api.py \
            tests/test_debate_service.py \
            tests/test_metrics.py \
            tests/test_config.py \
            tests/test_predictions.py \
            tests/test_card_events.py \
            tests/test_gameplay_contract_sync.py \
            -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check asset provenance
        run: npm run assets:provenance:check

      - name: Build frontend
        run: npm run build

      - name: Check performance budgets
        run: npm run perf:budgets:check

      - name: Run targeted frontend checks
        run: |
          npm test -- --run \
            src/lib/scenarioMeta.test.ts \
            src/lib/archiveSummary.test.ts \
            src/components/gameplayCards.test.ts \
            src/components/gameplayContract.test.ts \
            src/components/InterventionModal.test.tsx \
            src/components/ShareModal.test.tsx \
            src/pages/SimulationView.test.tsx \
            src/pages/ResultView.test.tsx \
            src/components/GameplayCardsModal.test.tsx \
            src/pages/DebateArenaView.test.tsx \
            src/pages/DebateResultView.test.tsx \
            src/components/DebateBetModal.test.tsx \
            src/components/DebateShareModal.test.tsx \
            src/hooks/useDebateWS.test.tsx \
            src/i18n/locales.test.ts \
            src/stores/simulationStore.test.ts

  release-signoff-dry-run:
    needs:
      - release-signoff-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create backend virtualenv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate release signoff contract
        working-directory: frontend
        run: node scripts/release-signoff.mjs --dry-run --headless --require-debate-adjudication-mode llm_hybrid --invocation-label ci-release-signoff-dry-run --output-root output/e2e/ci-release-signoff-dry-run

      - name: Upload release signoff dry-run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signoff-dry-run
          path: frontend/output/e2e/ci-release-signoff-dry-run

  debate-signoff-smoke:
    needs:
      - release-signoff-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create backend virtualenv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run debate signoff smoke
        env:
          LLM_RESPONSES_URL: ${{ secrets.LLM_RESPONSES_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          MOCK_LLM_PORT: "18319"
          MOCK_LLM_DELAY_MS: "100"
        run: |
          set -euo pipefail

          cleanup() {
            if [ -n "${MOCK_LLM_PID:-}" ]; then
              kill "${MOCK_LLM_PID}" || true
            fi
            if [ -n "${BACKEND_PID:-}" ]; then
              kill "${BACKEND_PID}" || true
            fi
            if [ -n "${FRONTEND_PID:-}" ]; then
              kill "${FRONTEND_PID}" || true
            fi
          }
          trap cleanup EXIT

          if [ "${{ needs.release-signoff-preflight.outputs.can_run }}" = "true" ]; then
            backend/.venv/bin/python -m uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port 18927 > /tmp/swarm-backend.log 2>&1 &
          else
            node scripts/mock-llm-server.mjs > /tmp/swarm-mock-llm-smoke.log 2>&1 &
            MOCK_LLM_PID=$!
            LLM_RESPONSES_URL=http://127.0.0.1:${MOCK_LLM_PORT}/v1/chat/completions \
            LLM_API_KEY=mock-ci \
            LLM_MODEL_NAME=gpt-5.4-mini \
            DEBATE_USE_LLM=true \
              backend/.venv/bin/python -m uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port 18927 > /tmp/swarm-backend.log 2>&1 &
          fi
          BACKEND_PID=$!

          (
            cd frontend
            npm run preview -- --host 127.0.0.1 --port 18928 > /tmp/swarm-frontend.log 2>&1
          ) &
          FRONTEND_PID=$!

          python - <<'PY'
          import time
          import urllib.request

          def wait_for(url: str, timeout_seconds: int = 60) -> None:
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status < 500:
                              return
                  except Exception:
                      time.sleep(1)
              raise SystemExit(f"Timed out waiting for {url}")

          wait_for("http://127.0.0.1:18927/")
          wait_for("http://127.0.0.1:18928/")
          if "${{ needs.release-signoff-preflight.outputs.can_run }}" != "true":
              wait_for("http://127.0.0.1:18319/healthz")
          PY

          cd frontend
          if [ "${{ needs.release-signoff-preflight.outputs.can_run }}" = "true" ]; then
            node scripts/e2e-debate-suite.mjs full --url http://127.0.0.1:18928 --output-dir output/e2e/ci-debate-signoff --require-adjudication-mode llm_hybrid --headless
          else
            node scripts/e2e-debate-suite.mjs full --url http://127.0.0.1:18928 --output-dir output/e2e/ci-debate-signoff --headless
          fi

      - name: Upload debate signoff smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-signoff-smoke
          path: |
            frontend/output/e2e/ci-debate-signoff
            /tmp/swarm-backend.log
            /tmp/swarm-frontend.log
            /tmp/swarm-mock-llm-smoke.log

  release-signoff-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create backend virtualenv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run fixture-backed release signoff
        env:
          SWARM_SIGNOFF_LABEL: ci-release-signoff-fixture
          SWARM_URL: http://127.0.0.1:18928
          SWARM_BACKEND_URL: http://127.0.0.1:18927
          SWARM_REQUIRE_DEBATE_ADJUDICATION_MODE: deterministic
          SWARM_E2E_FIXTURE_MODE: "1"
          MOCK_LLM_PORT: "18318"
          MOCK_LLM_DELAY_MS: "350"
        run: |
          set -euo pipefail

          cleanup() {
            if [ -n "${MOCK_LLM_PID:-}" ]; then
              kill "${MOCK_LLM_PID}" || true
            fi
            if [ -n "${BACKEND_PID:-}" ]; then
              kill "${BACKEND_PID}" || true
            fi
            if [ -n "${FRONTEND_PID:-}" ]; then
              kill "${FRONTEND_PID}" || true
            fi
          }
          trap cleanup EXIT

          node scripts/mock-llm-server.mjs > /tmp/swarm-mock-llm.log 2>&1 &
          MOCK_LLM_PID=$!

          LLM_RESPONSES_URL=http://127.0.0.1:18318/v1/chat/completions \
          LLM_API_KEY=mock-ci \
          DEBATE_USE_LLM=false \
          backend/.venv/bin/python -m uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port 18927 > /tmp/swarm-backend-fixture.log 2>&1 &
          BACKEND_PID=$!

          (
            cd frontend
            npm run preview -- --host 127.0.0.1 --port 18928 > /tmp/swarm-frontend-fixture.log 2>&1
          ) &
          FRONTEND_PID=$!

          python - <<'PY'
          import time
          import urllib.request

          def wait_for(url: str, timeout_seconds: int = 90) -> None:
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status < 500:
                              return
                  except Exception:
                      time.sleep(1)
              raise SystemExit(f"Timed out waiting for {url}")

          wait_for("http://127.0.0.1:18318/healthz")
          wait_for("http://127.0.0.1:18927/")
          wait_for("http://127.0.0.1:18928/")
          PY

          cd frontend
          npm run release:signoff -- --headless --require-debate-adjudication-mode deterministic --output-root output/e2e/ci-release-signoff-fixture

      - name: Upload fixture release signoff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signoff-fixture
          path: |
            frontend/output/e2e/ci-release-signoff-fixture
            /tmp/swarm-mock-llm.log
            /tmp/swarm-backend-fixture.log
            /tmp/swarm-frontend-fixture.log
