name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: .venv/bin/pip install -e ".[dev]"

      - name: Validate committed sample snapshots
        working-directory: .
        run: backend/.venv/bin/python scripts/validate_samples.py

      - name: Run backend tests
        run: .venv/bin/python -m pytest -q

      - name: Lint backend
        run: .venv/bin/ruff check app/ tests/

  cross-platform-backend-smoke:
    name: Backend portability (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            interpreter: ./.venv/bin/python
          - os: ubuntu-latest
            python: "3.13"
            interpreter: ./.venv/bin/python
          - os: windows-latest
            python: "3.11"
            interpreter: ./.venv/Scripts/python.exe
          - os: macos-latest
            python: "3.11"
            interpreter: ./.venv/bin/python
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: ${{ matrix.interpreter }} -m pip install -e ".[dev]"

      - name: Exercise configuration, startup, local packs, and SQLite boundaries
        run: >-
          ${{ matrix.interpreter }} -m pytest -q
          tests/test_config.py
          tests/test_preflight_cli.py
          tests/test_local_packs.py
          tests/test_startup_orphan_reconcile.py
          tests/test_resource_deletion.py
          tests/test_runtime_lock.py::test_runtime_lock_sqlite_connection_enables_busy_timeout_and_wal
          tests/test_runtime_lock.py::test_database_sqlite_engine_enables_wal_and_synchronous_normal
          tests/test_runtime_lock.py::test_bootstrap_sqlite_engine_enables_wal_and_synchronous_normal
          tests/test_runtime_lock.py::test_runtime_lock_acquire_release_round_trip
          tests/test_runtime_lock.py::test_runtime_lock_uses_sqlite_uri_database_for_shared_file_locking
          tests/test_runtime_lock.py::test_runtime_lock_uses_percent_encoded_sqlite_uri_database
          tests/test_runtime_lock.py::test_refresh_runtime_lock_retries_after_sqlite_busy_timeout
          tests/test_runtime_lock.py::test_get_engine_initializes_singleton_once_under_thread_race

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check asset provenance
        run: npm run assets:provenance:check

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend project references
        run: npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: Check performance budgets
        run: npm run perf:budgets:check

  cross-platform-frontend-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for command-runner execution tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for script smoke
        run: npx playwright install --with-deps chromium

      - name: Exercise cross-platform release signoff dry run
        run: node scripts/release-signoff.mjs --dry-run --skip-backend-checks --skip-assets-check --headless --output-root output/e2e/cross-platform-release-smoke

      - name: Verify teardown failure propagation
        run: >-
          node --input-type=module -e "import { closePlaywrightBrowser } from './scripts/playwrightTeardown.mjs'; const browser = { contexts: () => [], close: async () => { throw new Error('ci teardown smoke'); } }; let rejected = false; try { await closePlaywrightBrowser(browser, 'ci teardown smoke', 1); } catch (error) { rejected = error instanceof AggregateError; } if (!rejected) throw new Error('teardown failure was swallowed');"

      - name: Run frontend script unit smoke
        run: >-
          node --test scripts/release-command-runtime.test.mjs scripts/playwrightTeardown.test.mjs scripts/e2e-frontend-preflight.test.mjs scripts/e2eFixtureNet.test.mjs

      - name: Run release signoff contract tests
        run: npm test -- --run src/scripts/releaseSignoff.test.ts
