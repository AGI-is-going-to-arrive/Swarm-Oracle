[project]
name = "swarmoracle-backend"
version = "0.1.0"
description = "SwarmOracle — AI 'What-If' Prediction Playground (Backend)"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "chromadb>=0.6",
    "python-dotenv>=1.0",
    "websockets>=14.0",
    "alembic>=1.14",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx",        # for TestClient
    "ruff>=0.9",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
