services:
  backend:
    image: ghcr.io/agi-is-going-to-arrive/swarmoracle-backend:edge
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swarmoracle-backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      - DATABASE_URL=sqlite:////data/swarmoracle.db
      - CHROMA_PERSIST_DIR=/data/chroma_data
      # Containers must bind 0.0.0.0 internally. Default compose publishes both
      # frontend and backend on 127.0.0.1 only, so empty SESSION_SECRET/ADMIN_TOKEN
      # are allowed in development with startup warnings.
      # For production/public deployment, explicitly change the host publish
      # bindings and set ENV=production plus unique SESSION_SECRET and ADMIN_TOKEN
      # in .env.docker; production fail-fast blocks empty values.
      # Generate each secret with: openssl rand -hex 32
      # Do not reuse any example or public value.
      - HOST=0.0.0.0
      - PORT=18927
      - CORS_ORIGINS=["http://localhost","http://127.0.0.1","http://localhost:18928","http://127.0.0.1:18928"]
    extra_hosts:
      # DNS mapping only: a Linux host service bound solely to 127.0.0.1 is
      # still unreachable through this gateway. See deploy/README.md.
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/data
    ports:
      # Host publish is local-only by default. For public deployment, only
      # expose this port directly if you explicitly need direct backend access,
      # and configure ENV=production, SESSION_SECRET, and ADMIN_TOKEN.
      - "127.0.0.1:18927:18927"
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('localhost', 18927, timeout=5); c.request('GET', '/'); assert c.getresponse().status < 400"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/agi-is-going-to-arrive/swarmoracle-frontend:edge
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swarmoracle-frontend
    restart: unless-stopped
    ports:
      # Frontend proxies /api and /ws to the backend, so this must be local-only
      # by default too. For public deployment, explicitly change to 18928:80 and
      # configure ENV=production, SESSION_SECRET, and ADMIN_TOKEN in .env.docker.
      - "127.0.0.1:18928:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
