services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swarmoracle-backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - DATABASE_URL=sqlite:////data/swarmoracle.db
      - CHROMA_PERSIST_DIR=/data/chroma_data
      - HOST=0.0.0.0
      - PORT=18927
      - CORS_ORIGINS=["http://localhost","http://127.0.0.1","http://localhost:18928","http://127.0.0.1:18928"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/data
    ports:
      - "18927:18927"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:18927/'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swarmoracle-frontend
    restart: unless-stopped
    ports:
      - "18928:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
