version: "3.9"

services:
  backend:
    build: ./backend
    container_name: swarmoracle-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/swarmoracle.db
      - CHROMA_PERSIST_DIR=/data/chroma_data
      - HOST=0.0.0.0
      - PORT=18927
      - CORS_ORIGINS=["http://localhost","http://localhost:18928"]
    volumes:
      - backend-data:/data
    ports:
      - "18927:18927"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.post('http://localhost:18927/api/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: swarmoracle-frontend
    restart: unless-stopped
    ports:
      - "18928:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
