services:
  backend:
    image: ghcr.io/agi-is-going-to-arrive/swarmoracle-backend:edge
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swarmoracle-backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      - DATABASE_URL=sqlite:////data/swarmoracle.db
      - CHROMA_PERSIST_DIR=/data/chroma_data
      # Containers must bind 0.0.0.0. That is a public-bind signal to the
      # backend, so Docker/public deployment requires SESSION_SECRET and
      # ADMIN_TOKEN in .env.docker before startup.
      # Generate two separate values with: openssl rand -hex 32
      # Example format: 402558561433ee03f5b4ed1686cba7ec96558454d762831fecd688ba242955b2
      - HOST=0.0.0.0
      - PORT=18927
      - CORS_ORIGINS=["http://localhost","http://127.0.0.1","http://localhost:18928","http://127.0.0.1:18928"]
    extra_hosts:
      # Docker Desktop resolves host.docker.internal; Linux needs host-gateway support or an explicit host IP.
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/data
    ports:
      # Host publish is local-only by default. For public deployment,
      # explicitly publish 18927:18927 and configure mandatory
      # SESSION_SECRET/ADMIN_TOKEN in .env.docker.
      - "127.0.0.1:18927:18927"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:18927/'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/agi-is-going-to-arrive/swarmoracle-frontend:edge
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swarmoracle-frontend
    restart: unless-stopped
    ports:
      - "18928:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
